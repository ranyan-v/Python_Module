[project]
name = "ex1"
version = "0.1.0"
description = "Matrix data analysis and dependency management exercise"
authors = [
    {name = "rayan",email = "ran.yan.v@outlook.com"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy (>=2.2.6,<3.0.0)",
    "pandas (>=2.3.3,<4.0.0)",
    "matplotlib (>=3.10.0,<3.11.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)"
]
